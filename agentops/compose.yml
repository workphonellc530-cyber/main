services:
  agentops:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Persist DB inside a mounted volume.
      DATABASE_URL: "file:/data/dev.db"
      APP_URL: "http://localhost:3000"
      SESSION_SECRET: "change_me_change_me_change_me_change_me_change_me"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: "gpt-4o-mini"
      STRIPE_SECRET_KEY: ""
      STRIPE_PRICE_ID: ""
      STRIPE_WEBHOOK_SECRET: ""
    volumes:
      - agentops_data:/data

volumes:
  agentops_data:

